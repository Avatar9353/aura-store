<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Store | Minimalist Essentials</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col custom-scroll">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl font-black tracking-widest text-white uppercase">AURA<span class="text-indigo-500">.</span></span>
      </div>
      <button onclick="toggleCartDrawer()" class="relative p-2.5 rounded-full bg-slate-900 border border-slate-800 hover:border-slate-700 transition">
        <i data-lucide="shopping-bag" class="w-5 h-5 text-slate-300"></i>
        <span id="cartCountBadge" class="absolute -top-1 -right-1 bg-indigo-600 text-white text-[11px] font-bold rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 pb-6 text-center">
    <span class="px-3.5 py-1 text-xs font-semibold rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Summer '26 Collection</span>
    <h1 class="text-3xl sm:text-5xl font-black text-white mt-3 tracking-tight">Precision Gear & Daily Essentials.</h1>
    <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto mt-2">Engineered with minimalism and everyday durability in mind.</p>
  </section>

  <!-- Search Bar -->
  <div class="max-w-md mx-auto w-full px-4 mb-8">
    <div class="relative">
      <input 
        type="text" 
        id="searchInput" 
        oninput="handleSearch(this.value)" 
        placeholder="Search products by title or category..." 
        class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm"
      />
      <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
    </div>
  </div>

  <!-- Product Catalog Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-24 flex-grow w-full">
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </main>

  <!-- Product Detail Modal (Description, Size, Color, Buy Now) -->
  <div id="productModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden flex flex-col relative max-h-[90vh]">
      <button onclick="closeProductModal()" class="absolute top-4 right-4 z-10 p-2 rounded-full bg-slate-800/80 text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      
      <div class="h-64 sm:h-72 overflow-hidden bg-slate-800 relative flex-shrink-0">
        <img id="modalImg" src="" alt="Product" class="w-full h-full object-cover">
      </div>

      <div class="p-6 overflow-y-auto custom-scroll flex flex-col gap-4">
        <div>
          <span id="modalCategory" class="text-xs font-semibold text-indigo-400 uppercase tracking-wider"></span>
          <h2 id="modalName" class="text-xl font-bold text-white mt-1"></h2>
          <p id="modalPrice" class="text-2xl font-black text-indigo-400 mt-2"></p>
        </div>

        <p id="modalDesc" class="text-sm text-slate-400 leading-relaxed"></p>

        <!-- Size Options -->
        <div id="sizeSection">
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Select Size</label>
          <div id="sizeOptions" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Color Options -->
        <div id="colorSection">
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Select Color</label>
          <div id="colorOptions" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-3 pt-2">
          <button onclick="addCurrentModalToCart()" class="py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold text-sm transition flex items-center justify-center gap-2">
            <i data-lucide="shopping-bag" class="w-4 h-4"></i> Add to Cart
          </button>
          <button onclick="buyNowCurrentModal()" class="py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition flex items-center justify-center gap-2">
            <i data-lucide="zap" class="w-4 h-4"></i> Buy Now
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart Slide-Over Drawer -->
  <div id="cartDrawer" class="fixed inset-0 z-50 overflow-hidden hidden">
    <div onclick="toggleCartDrawer()" class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity"></div>
    <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
      <div class="w-screen max-w-md bg-slate-900 border-l border-slate-800 flex flex-col p-6 shadow-2xl">
        <div class="flex items-center justify-between pb-4 border-b border-slate-800">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="shopping-bag" class="w-5 h-5 text-indigo-400"></i> Your Bag
          </h2>
          <button onclick="toggleCartDrawer()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <div id="cartItemsContainer" class="flex-grow overflow-y-auto py-4 space-y-4 custom-scroll"></div>

        <div class="pt-4 border-t border-slate-800 space-y-3">
          <div class="flex justify-between items-center text-sm font-medium">
            <span class="text-slate-400">Total:</span>
            <span id="cartSubtotal" class="text-xl font-black text-white">₹0</span>
          </div>
          <button onclick="openCheckoutModal()" id="checkoutTriggerBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-white font-semibold text-sm transition">
            Proceed to Checkout
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Checkout Address Form Modal (Formspree: xbgjvpqn) -->
  <div id="checkoutModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 relative max-h-[95vh] overflow-y-auto custom-scroll">
      <button onclick="closeCheckoutModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <h2 class="text-xl font-bold text-white mb-4">Complete Delivery Address</h2>
      
      <form id="orderForm" action="https://formspree.io/f/xbgjvpqn" method="POST" class="space-y-4 text-sm">
        <input type="hidden" name="Order_ID" id="orderIdField">
        <input type="hidden" name="Order_Summary" id="orderSummaryField">

        <div>
          <label class="block text-slate-300 font-medium mb-1">Full Name</label>
          <input type="text" name="Full_Name" required placeholder="John Doe" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">Phone Number</label>
          <input type="tel" name="Phone_Number" required placeholder="10-digit mobile number" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">Flat, House no., Building</label>
          <input type="text" name="Address_Line_1" required placeholder="House/Flat No." class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">Area, Street, Sector</label>
          <input type="text" name="Address_Line_2" required placeholder="Street / Sector name" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-medium mb-1">City</label>
            <input type="text" name="City" required placeholder="City" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-slate-300 font-medium mb-1">Pincode</label>
            <input type="text" name="Pincode" required placeholder="6 digits" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1">Payment Method</label>
          <select name="Payment_Method" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500">
            <option value="Cash on Delivery">Cash on Delivery</option>
            <option value="UPI / Online Payment">UPI / Online Payment</option>
          </select>
        </div>

        <button type="submit" class="w-full mt-2 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition">
          Confirm & Place Order
        </button>
      </form>
    </div>
  </div>

  <!-- Success Confirmation Modal -->
  <div id="successModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-4 text-center">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-8">
      <div class="w-14 h-14 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-500/30">
        <i data-lucide="check" class="w-7 h-7"></i>
      </div>
      <h3 class="text-xl font-bold text-white">Order Received!</h3>
      <p class="text-slate-400 text-xs mt-1">Order Ref: <span id="confirmedOrderId" class="font-mono text-indigo-400 font-bold"></span></p>
      <p class="text-slate-400 text-sm mt-3">We have received your order details and will begin dispatch shortly.</p>
      <button onclick="document.getElementById('successModal').classList.add('hidden')" class="w-full mt-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm font-semibold transition">
        Continue Shopping
      </button>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Product Catalog Data - Customize items, descriptions, sizes, colors, and prices here
    const products = [
      {
        id: 1,
        name: "Aura Nomad Canvas Duffel",
        price: 3499,
        category: "Bags",
        img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80",
        desc: "Handcrafted water-resistant waxed canvas duffel with brass hardware and reinforced strap stitching. Built for weekend getaways and rugged daily travel.",
        sizes: ["Standard", "Extra Large"],
        colors: ["Charcoal", "Olive Green", "Desert Tan"]
      },
      {
        id: 2,
        name: "Tactile Keychron Desk Mat",
        price: 1299,
        category: "Desk",
        img: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=600&q=80",
        desc: "Micro-woven felt desk mat with anti-slip rubber backing. Offers optimal mouse gliding resistance and protects desk surface finishes.",
        sizes: ["Medium (70x30cm)", "Large (90x40cm)"],
        colors: ["Dark Slate", "Light Grey"]
      },
      {
        id: 3,
        name: "Aero Minimalist Titanium Pen",
        price: 1899,
        category: "Gear",
        img: "https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?auto=format&fit=crop&w=600&q=80",
        desc: "Machined from aircraft-grade titanium alloy with a precision bolt-action mechanism. Compatible with Schmidt EasyFlow 9000 ink refills.",
        sizes: ["One Size"],
        colors: ["Matte Black", "Stonewashed Grey"]
      },
      {
        id: 4,
        name: "Monolith Ceramic Pour-Over Set",
        price: 2499,
        category: "Lifestyle",
        img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80",
        desc: "Double-fired stoneware dripper and serving carafe engineered with interior thermal ridges for precise coffee extraction temperature stability.",
        sizes: ["500ml", "800ml"],
        colors: ["Matte Obsidian", "Chalk White"]
      }
    ];

    let cart = [];
    let selectedProduct = null;
    let selectedSize = '';
    let selectedColor = '';

    // Render Product Cards
    function renderProducts(items = products) {
      const grid = document.getElementById('productGrid');
      if (items.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-16 text-slate-500 text-sm">No items found matching your search.</div>';
        return;
      }

      grid.innerHTML = items.map(p => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col hover:border-slate-700 transition cursor-pointer group" onclick="openProductModal(${p.id})">
          <div class="h-56 overflow-hidden bg-slate-800">
            <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          </div>
          <div class="p-5 flex flex-col flex-grow">
            <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">${p.category}</span>
            <h3 class="font-bold text-white text-base mt-1 line-clamp-1">${p.name}</h3>
            <p class="text-slate-400 text-xs mt-1 line-clamp-2">${p.desc}</p>
            <div class="mt-auto pt-4 flex items-center justify-between">
              <span class="font-black text-lg text-white">₹${p.price.toLocaleString('en-IN')}</span>
              <button onclick="event.stopPropagation(); openProductModal(${p.id});" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-semibold text-white flex items-center gap-1">
                View
              </button>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    // Live Search Filter
    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      const filtered = products.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
      renderProducts(filtered);
    }

    // Open Product Detail Modal
    function openProductModal(id) {
      selectedProduct = products.find(p => p.id === id);
      if (!selectedProduct) return;

      document.getElementById('modalImg').src = selectedProduct.img;
      document.getElementById('modalCategory').innerText = selectedProduct.category;
      document.getElementById('modalName').innerText = selectedProduct.name;
      document.getElementById('modalPrice').innerText = '₹' + selectedProduct.price.toLocaleString('en-IN');
      document.getElementById('modalDesc').innerText = selectedProduct.desc;

      // Render sizes
      selectedSize = selectedProduct.sizes[0] || 'Standard';
      document.getElementById('sizeOptions').innerHTML = selectedProduct.sizes.map((s, idx) => `
        <button type="button" onclick="selectSize('${s}', this)" class="size-btn px-3 py-1.5 rounded-lg text-xs font-medium border ${idx === 0 ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}">
          ${s}
        </button>
      `).join('');

      // Render colors
      selectedColor = selectedProduct.colors[0] || 'Default';
      document.getElementById('colorOptions').innerHTML = selectedProduct.colors.map((c, idx) => `
        <button type="button" onclick="selectColor('${c}', this)" class="color-btn px-3 py-1.5 rounded-lg text-xs font-medium border ${idx === 0 ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}">
          ${c}
        </button>
      `).join('');

      document.getElementById('productModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function selectSize(size, el) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.className = 'size-btn px-3 py-1.5 rounded-lg text-xs font-medium border bg-slate-800 border-slate-700 text-slate-300';
      });
      el.className = 'size-btn px-3 py-1.5 rounded-lg text-xs font-medium border bg-indigo-600 border-indigo-500 text-white';
    }

    function selectColor(color, el) {
      selectedColor = color;
      document.querySelectorAll('.color-btn').forEach(btn => {
        btn.className = 'color-btn px-3 py-1.5 rounded-lg text-xs font-medium border bg-slate-800 border-slate-700 text-slate-300';
      });
      el.className = 'color-btn px-3 py-1.5 rounded-lg text-xs font-medium border bg-indigo-600 border-indigo-500 text-white';
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.add('hidden');
    }

    // Add current modal selection to Cart
    function addCurrentModalToCart() {
      if (!selectedProduct) return;
      const cartItemId = `${selectedProduct.id}-${selectedSize}-${selectedColor}`;
      const existing = cart.find(item => item.cartId === cartItemId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          cartId: cartItemId,
          id: selectedProduct.id,
          name: selectedProduct.name,
          price: selectedProduct.price,
          img: selectedProduct.img,
          size: selectedSize,
          color: selectedColor,
          qty: 1
        });
      }
      updateCartUI();
      closeProductModal();
      toggleCartDrawer(true);
    }

    // Buy Now: adds to cart and immediately shows delivery checkout form
    function buyNowCurrentModal() {
      addCurrentModalToCart();
      toggleCartDrawer(false);
      openCheckoutModal();
    }

    // Update Cart Drawer & Badges
    function updateCartUI() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      
      const badge = document.getElementById('cartCountBadge');
      badge.innerText = count;
      badge.classList.toggle('hidden', count === 0);

      document.getElementById('cartSubtotal').innerText = '₹' + subtotal.toLocaleString('en-IN');
      const container = document.getElementById('cartItemsContainer');

      if (cart.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-500 text-sm">Your cart is empty.</div>';
        document.getElementById('checkoutTriggerBtn').disabled = true;
        document.getElementById('checkoutTriggerBtn').classList.add('opacity-50', 'pointer-events-none');
        return;
      }
